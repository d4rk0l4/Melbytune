name: Build MelbyTune

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar o .exe (arquivo único)
        run: pyinstaller --noconfirm --onefile --windowed --uac-admin --icon assets/icon.ico --add-data "assets;assets" --collect-all customtkinter --name MelbyTune main.py

      - name: Gerar a versão em pasta (costuma dar menos alarme falso de antivírus)
        run: pyinstaller --noconfirm --onedir --windowed --uac-admin --icon assets/icon.ico --add-data "assets;assets" --collect-all customtkinter --name MelbyTune --distpath dist-pasta --workpath build-pasta main.py

      - name: Testar os dois no Windows (abre, passa por todas as telas e fecha)
        shell: pwsh
        run: |
          $fail = $false
          foreach ($exe in @("dist\MelbyTune.exe", "dist-pasta\MelbyTune\MelbyTune.exe")) {
            $dir = Join-Path $env:APPDATA "MelbyTune"
            Remove-Item "$dir\selftest.txt","$dir\erro.log" -ErrorAction SilentlyContinue
            $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru -Wait
            $r = if (Test-Path "$dir\selftest.txt") { (Get-Content "$dir\selftest.txt" -Raw).Trim() } else { "(selftest não gerou arquivo)" }
            $e = if (Test-Path "$dir\erro.log") { (Get-Content "$dir\erro.log" -Raw).Trim() } else { "sem erro.log" }
            $msg = "$exe -> exit $($p.ExitCode) | $r | $e"
            Write-Host $msg
            $one = ($msg -replace "\r?\n", " / ")
            Write-Host "::notice title=Autoteste::$one"
            if ($p.ExitCode -ne 0) { $fail = $true }
          }
          if ($fail) { exit 1 }

      - name: Compactar a versão em pasta
        run: Compress-Archive -Path dist-pasta\MelbyTune -DestinationPath MelbyTune-pasta.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MelbyTune
          path: dist/MelbyTune.exe

      - uses: actions/upload-artifact@v4
        with:
          name: MelbyTune-pasta
          path: MelbyTune-pasta.zip
