name: Build MelbyTune

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar o .exe
        run: pyinstaller --noconfirm --onefile --windowed --uac-admin --icon assets/icon.ico --add-data "assets;assets" --collect-all customtkinter --name MelbyTune main.py

      - uses: actions/upload-artifact@v4
        with:
          name: MelbyTune
          path: dist/MelbyTune.exe
