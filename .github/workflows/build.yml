name: Build MelbyTune

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar o .exe
        run: pyinstaller --noconfirm --onefile --windowed --uac-admin --icon assets/icon.ico --add-data "assets;assets" --collect-all customtkinter --name MelbyTune main.py

      - name: Testar o .exe no Windows (abre, passa por todas as telas e fecha)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\MelbyTune.exe" -ArgumentList "--selftest" -PassThru -Wait
          $dir = Join-Path $env:APPDATA "MelbyTune"
          "--- selftest.txt ---"; if (Test-Path "$dir\selftest.txt") { Get-Content "$dir\selftest.txt" } else { "(não gerou)" }
          "--- erro.log ---"; if (Test-Path "$dir\erro.log") { Get-Content "$dir\erro.log" } else { "(sem erros)" }
          "exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MelbyTune
          path: dist/MelbyTune.exe
